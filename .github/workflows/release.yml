name: Release

# Builds the Windows installer and publishes it (plus latest.yml for the
# in-app auto-updater) to a GitHub Release whenever a version tag is pushed.
#
#   1. bump "version" in package.json (e.g. 0.1.1)
#   2. git commit -am "Release v0.1.1"
#   3. git tag v0.1.1 && git push origin v0.1.1
#
# The installed app's "Check for updates" then finds the new release.

on:
  push:
    tags:
      - 'v*'
  # Manual trigger: builds the version currently in package.json and
  # publishes it as a full release (electron-builder creates the tag).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Manual runs have no tag yet, but a published release requires one —
      # create and push it here (runner token has contents:write).
      - name: Ensure version tag exists (manual runs)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$v" 2>$null
          git push origin "v$v" 2>$null
          exit 0

      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-vite build && npx electron-builder --win nsis --publish always
