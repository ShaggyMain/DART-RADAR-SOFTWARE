name: Release

# Builds the Windows installer and publishes it (plus latest.yml for the
# in-app auto-updater) to a GitHub Release.
#
# Trigger it from the Actions tab (Run workflow) — it builds the version
# currently in package.json. The installed app's "Check for updates" then
# finds the new release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Publishing multiple files with electron-builder's "always" mode used to
      # race: two parallel uploads each created a GitHub release for the tag, so
      # the installer, blockmap and latest.yml were split across TWO releases and
      # the one the updater reads as "latest" had no latest.yml (404 on update).
      #
      # Fix: delete every existing release for this tag, move the tag to the
      # current commit, and pre-create ONE release. electron-builder then finds
      # that release and uploads all assets into it instead of creating its own.
      # (Pushes using the automatic GITHUB_TOKEN don't re-trigger this workflow.)
      - name: Prepare a single clean release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $v = node -p "require('./package.json').version"
          $tag = "v$v"
          $ids = gh api "repos/$repo/releases" --paginate --jq ".[] | select(.tag_name==`"$tag`") | .id"
          foreach ($id in ($ids -split "`n")) {
            $id = $id.Trim()
            if ($id) { gh api -X DELETE "repos/$repo/releases/$id"; Write-Host "deleted stale release $id" }
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f $tag
          git push -f origin $tag
          gh release create $tag --title $v --notes "VectorMind $v" --target $env:GITHUB_SHA
          exit 0

      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-vite build && npx electron-builder --win nsis --publish always
