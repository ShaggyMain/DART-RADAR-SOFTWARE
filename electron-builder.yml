appId: app.vectormind.desktop
productName: VectorMind
copyright: VectorMind — independent practice tool, not affiliated with EUROCONTROL/FEAST

directories:
  output: dist
  buildResources: build

files:
  - out/**

# Update feed: reads published GitHub Releases of this repo. Releases must be
# public for the in-app updater to fetch them without a runtime token.
#
# Uploads go into a DRAFT release; the workflow publishes it only once every
# asset is attached. A published-but-empty release would briefly become
# "latest" and break every update check until latest.yml finished uploading.
publish:
  provider: github
  owner: ShaggyMain
  repo: DART-RADAR-SOFTWARE
  releaseType: draft

# node:sqlite is built into Electron — no native modules to rebuild/unpack.
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: VectorMind
